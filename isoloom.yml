# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF HTTP Response Splitting (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask page that writes the numero parameter into the response unescaped (header and response injection). The SKF lab folder python/http-response-splitting is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (app/Dockerfile.ctf) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-http-response-splitting

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.165.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    ports: { web: { port: 5000, protocol: http, publish: 5050 } }
    resources: { cpus: 1, memory_mb: 256 }
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    setup:
      - ctf/flag.sh
    app:
      build:
        context: app
        dockerfile: app/Dockerfile.ctf

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: the numero parameter is written into the /web response
    script: checks/reflect.sh

message: |
  OWASP SKF HTTP Response Splitting answers at http://localhost:{{ machines.web.ports.web.published }}/.
  The form sends a number to /web. Does it have to be a number?
